server {
    listen 80;
    server_name 94.156.202.111 kilimaholdings.com www.kilimaholdings.com localhost;

    client_max_body_size 16M;

    # Challenge Let's Encrypt / Certbot
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Endpoint de healthcheck pour Nginx
    location /healthz {
        return 200 'ok';
        add_header Content-Type text/plain;
    }

    # Fichiers médias / téléversés (Backend)
    location /media/ {
        alias /app/backend/uploads/;
    }

    # API Backend (Django) - Utilisation d'une variable pour éviter l'erreur "host not found" au démarrage
    location /api/ {
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Interface Frontend (Next.js)
    location / {
        set $frontend_upstream http://frontend:3000;
        proxy_pass $frontend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}