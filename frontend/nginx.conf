server {
    listen 80;
    server_name kilimaholdings.com www.kilimaholdings.com;

    # Challenge Let's Encrypt / Certbot
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Endpoint de healthcheck pour Nginx
    location /healthz {
        return 200 'ok';
        add_header Content-Type text/plain;
    }

    # Redirection HTTP vers HTTPS (une fois les certificats installés)
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name kilimaholdings.com www.kilimaholdings.com;

    ssl_certificate /etc/letsencrypt/live/kilimaholdings.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kilimaholdings.com/privkey.pem;

    client_max_body_size 16M;

    # Fichiers médias / téléversés (Backend)
    location /media/ {
        alias /app/backend/uploads/;
    }

    # API Backend (Django)
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Interface Frontend (Next.js)
    location / {
        proxy_pass http://frontend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}